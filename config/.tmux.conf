# -------------------------------
# 1. Vim-style pane navigation
# -------------------------------
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# -------------------------------
# 2. Prefix key
# -------------------------------
unbind M-b
set -g prefix M-s
bind M-s send-prefix

# -------------------------------
# 3. Status bar
# -------------------------------
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default,fg=colour7"
set -g status-left-length 100
set -g status-right-length 100

# -------------------------------
# 4. Status Left — icons preserved
# -------------------------------
set -g status-left ""
set -ga status-left '#{?client_prefix,#[bold,fg=colour1],#[fg=colour2]}  #S '
set -ga status-left '#[fg=colour8]│'
set -ga status-left '#[fg=colour3]  #{pane_current_command} '
set -ga status-left '#[fg=colour8]│'
set -ga status-left '#[fg=colour4]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} '
set -ga status-left '#[fg=colour8]#{?window_zoomed_flag,│,}'
set -ga status-left '#[fg=colour3]#{?window_zoomed_flag,  zoom ,}'

# -------------------------------
# 5. Status Right — icons preserved
# -------------------------------
set -g status-right ""
set -ga status-right '#[fg=colour8]│'
set -ga status-right '#[fg=colour5] 󰖩 '
set -ga status-right '#[fg=colour8]│'
set -ga status-right '#[fg=colour4] 󰭦 %Y-%m-%d 󰅐 %H:%M '

# -------------------------------
# 6. Pane borders
# -------------------------------
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "fg=colour8"
setw -g pane-border-style "fg=colour8"
setw -g pane-border-lines single

# -------------------------------
# 7. Window appearance
# -------------------------------
setw -g automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format ' #I#{?#{!=:#{window_name},Window},: #W,} '
set -g window-status-style "bg=default,fg=colour7"
set -g window-status-last-style "bg=default,fg=colour3"
set -g window-status-activity-style "bg=colour1,fg=colour7"
set -g window-status-bell-style "bg=colour1,fg=colour7,bold"
set -gF window-status-separator '#[fg=colour8]│'

set -g window-status-current-format ' #I#{?#{!=:#{window_name},Window},: #W,} '
set -g window-status-current-style "bg=colour3,fg=colour0,bold"

# -------------------------------
# 8. Mouse
# -------------------------------
set -g mouse on

# -------------------------------
# 9. Reload config
# -------------------------------
bind r source-file ~/.tmux.conf

# -------------------------------
# 10. Pane splitting
# -------------------------------
bind h split-window -v
bind v split-window -h

# Prefix + n: prompt for a new session name
bind n command-prompt -I "" "new-session -s '%%'"

#enable ctrl arrow
bind -n C-Left  send-keys M-b
bind -n C-Right send-keys M-f

# -------------------------------
# Keybinding reference
# -------------------------------
# Ctrl+h/j/k/l       -> Navigate panes
# Ctrl+s             -> Prefix
# Prefix + r         -> Reload config
# Prefix + v         -> Split vertically
# Prefix + h         -> Split horizontally
# Prefix + x         -> Kill current pane (default)
# Prefix + z         -> Toggle pane zoom (default)
# Prefix + o         -> Switch pane (default)
# Prefix + ;         -> Last active pane (default)
# Prefix + c         -> New window (default)
# Prefix + &         -> Kill window (default)
# Prefix + n/p       -> Next/previous window (default)
# Prefix + ,         -> Rename window (default)
# Prefix + $         -> Rename session (default)
# Prefix + s         -> List sessions (default)
# Prefix + d         -> Detach (default)
# Prefix + [ / ]     -> Copy mode / paste buffer
#
# Note:
# The 󰖩 icon is decorative; online status is no longer dynamic.
# Battery indicators are removed because they required a plugin.
# A Nerd Font is needed to display the icons correctly.
